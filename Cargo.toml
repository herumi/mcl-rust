[package]
name = "mcl_rust"
version = "1.0.4"
authors = ["MITSUNARI Shigeo <herumi@nifty.com>"]
description = "a wrapper class/function of a pairing library; https://github.com/herumi/mcl"
license = "BSD-3-Clause OR MIT OR Apache-2.0"
edition = "2018"
repository = "https://github.com/herumi/mcl-rust"
homepage = "https://github.com/herumi/mcl"

# On wasm there is no C++ runtime to link; fp.cpp is built standalone.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
link-cplusplus = "1"

[build-dependencies]
cmake = "0.1"
